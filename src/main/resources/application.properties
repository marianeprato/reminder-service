spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:reminders}
spring.datasource.username=${DB_USERNAME:reminder}
spring.datasource.password=${DB_PASSWORD:reminder}
# Default is 30s: a DB outage would otherwise hang every request (and every
# Kafka listener invocation) for 30 seconds before failing. 5s still
# comfortably covers normal pool contention under load.
spring.datasource.hikari.connection-timeout=5000
# Flyway is the sole authority on schema; JPA only validates it matches the
# entities at startup instead of managing DDL itself.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
server.port=8081

management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=when-authorized

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=reminder-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=org.reminderservice.event
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=org.reminderservice.event.TaskCreatedEvent

# Only used to publish to the dead-letter topic when a record exhausts its
# retries -- this service otherwise has no reason to produce to Kafka.
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

app.kafka.topic.task-created=task-created
